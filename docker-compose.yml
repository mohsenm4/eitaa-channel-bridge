services:
  bridge:
    build: .
    image: eitaa-channel-bridge:latest
    container_name: eitaa-bridge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bridge-data:/app/data
      - bridge-site:/app/site

  web:
    image: nginx:1.27-alpine
    container_name: eitaa-bridge-web
    restart: unless-stopped
    depends_on:
      - bridge
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - bridge-site:/srv/site:ro
    configs:
      - source: nginx_default
        target: /etc/nginx/conf.d/default.conf

configs:
  nginx_default:
    content: |
      server {
          listen 80;
          server_name _;
          root /srv/site;
          index index.html;
          charset utf-8;
          add_header Cache-Control "no-cache, must-revalidate" always;
          location / {
              try_files $$uri $$uri/ =404;
          }
          location ~ \.(?:html|json)$$ { expires off; }
          location ~* \.(?:css|js|svg|woff2?|png|jpg|jpeg|gif|webp)$$ { expires 1h; }
      }

volumes:
  bridge-data:
  bridge-site:
