<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-site-title>سایت کانال</title>
  <link rel="preconnect" href="https://eitaa.com">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <h1 data-site-title>سایت کانال</h1>
      <p class="subtitle" id="site-subtitle">تولید شده توسط Eitaa Channel Bridge</p>
    </div>
    <div class="meta" id="meta">در حال بارگذاری…</div>
  </header>

  <nav class="filters" id="filters" hidden></nav>

  <main id="grid" class="grid"></main>

  <footer class="site-footer">
    <p>پست‌های منتشر شده در <code>posts.json</code> هستن. هر بار بریج پست جدیدی منتشر کنه، Refresh کافیه.</p>
  </footer>

  <template id="card-template">
    <article class="card">
      <header class="card-head">
        <span class="badge"></span>
        <a class="permalink" target="_blank" rel="noopener" title="مشاهده روی ایتا">↗</a>
      </header>
      <h2 class="card-title"></h2>
      <p class="card-subtitle"></p>
      <p class="card-event-date"></p>
      <div class="card-photos"></div>
      <p class="card-text"></p>
      <footer class="card-foot">
        <span class="card-date"></span>
        <span class="card-hashtags"></span>
      </footer>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
